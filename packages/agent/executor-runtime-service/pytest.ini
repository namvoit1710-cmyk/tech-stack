[pytest]
testpaths = tests
pythonpath = .
addopts =
    -ra
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=85

[coverage:run]
source = app
branch = True
omit =
    */tests/*
    */.venv/*
    */venv/*
    */site-packages/*
    */__pycache__/*
    */agent-sdk/*
    */agent_sdk/*

[coverage:report]
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    if TYPE_CHECKING:
    if __name__ == .__main__.:
    raise NotImplementedError
    \.\.\.