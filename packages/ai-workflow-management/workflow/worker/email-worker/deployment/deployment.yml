name: worker-email-worker
image: worker/email-worker:latest
routePrefix: smdg-ai-dev-worker-email-worker
buildContext: ..
buildContexts:
  worker-sdk: ../../worker-sdk
  json_csv_streamer: ../../../libs/json-csv-streamer

memory:
  dev: 128M
  qas: 128M

http2: false

instances:
  dev: 1
  qas: 1

env:
  WORKER_CHUNKED_OUTPUT_ENABLED:
    dev: "true"
    qas: "true"
  APP_NAME:
    dev: "Email Worker"
    qas: "Email Worker"
  WORKER_TYPE:
    dev: "email"
    qas: "email"
  INFRA_MODE:
    dev: "sap"
    qas: "sap"
  MESSAGING_MODE:
    dev: "sap"
    qas: "sap"
  LOG_LEVEL:
    dev: DEBUG
    qas: INFO
  SERVER_HOST:
    dev: "0.0.0.0"
    qas: "0.0.0.0"
  SERVER_PORT:
    dev: 38001
    qas: 38001
  PROXY_URL:
    dev: https://smdg-ai-dev-worker-email-worker-dev.cfapps.br10.hana.ondemand.com
    qas: https://smdg-ai-dev-worker-email-worker-qas.cfapps.br10.hana.ondemand.com
  REGISTRY_URL:
    dev: https://smdg-ai-dev-ai-workflow-worker-executor.cfapps.br10.hana.ondemand.com
    qas: https://smdg-ai-dev-ai-workflow-worker-executor-qas.cfapps.br10.hana.ondemand.com
  FILE_SERVICE_URL:
    dev: https://smdg-ai-dev-file-service-dev.cfapps.br10.hana.ondemand.com
    qas: https://smdg-ai-dev-file-service-qas.cfapps.br10.hana.ondemand.com

# No bindings on any tier. These workers reach the control plane over HTTP via
# REGISTRY_URL/PROXY_URL and hold no state of their own, so they need neither
# the HANA container nor an Event Mesh instance. They are unbound on tenant-1
# today as well -- the empty value is parity, not an oversight. Adding a
# `tenant-2:` key here would bind them to more than they run with anywhere else.
services:
