# Run the claude-worker in Docker (portable — Linux server, WSL, or Docker Desktop).
# Use Docker Compose v2 (`docker compose`, NOT the old hyphenated `docker-compose`).
#
#     cd .../workflow/worker/claude-worker
#     docker compose up --build          # build + run in the foreground
#     docker compose up -d --build       # ...detached
#     docker compose logs -f             # follow logs
#     docker compose down                # stop
#
# Build context is the PARENT worker/ dir (claude-worker needs sibling worker-sdk).
# Credentials are env-first (app/secrets.py): put them in ./.env (see below) — nothing
# is mounted from the host, so this is portable to a Linux server.
services:
  claude-worker:
    build:
      context: ..
      dockerfile: claude-worker/Dockerfile
    image: claude-worker:local
    container_name: claude-worker
    # Pin public resolvers — the Docker/WSL embedded DNS intermittently throws
    # "Temporary failure in name resolution", which drops the lease calls.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    # Credentials from ./.env (env-first): CLAUDE_WORKER_GITHUB_PAT,
    # CLAUDE_WORKER_GITLAB_PAT, CLAUDE_WORKER_CLAUDE_CLI_TOKEN — injected as env vars,
    # never baked into the image. The Claude CLI authenticates with the token.
    env_file:
      - .env
    environment:
      APP_MODE: PULL
      # Fleet-wide Claude defaults. A node that leaves its model/effort field
      # blank uses these; a node that sets them wins. Change here + restart to
      # move every claude node in every workflow at once.
      CLAUDE_WORKER_DEFAULT_MODEL: claude-sonnet-5
      CLAUDE_WORKER_DEFAULT_EFFORT: medium
      # app/pull_multi.py forced lease renewal ON in code; the SDK's runner reads
      # this setting and defaults it OFF. Pinned so deleting that fork does not
      # silently disable renewal: multi-minute agentic tasks (clone + a full Claude implementation) far outlive the
      # executor's lease TTL,
      # so without renewal the lease expires mid-run, the executor re-leases the
      # task, and the late callback is rejected 409 (TASK_SUPERSEDED) — a re-run loop.
      LEASE_RENEW_ENABLED: "true"
      WORKER_TENANT: ""
      REGISTRY_URL: https://smdg-ai-tenant-1-ai-workflow-worker-executor.cfapps.br10.hana.ondemand.com
      # How many tasks this container runs AT ONCE (the SDK's WorkerConcurrency gate).
      # 0/unset would mean one at a time. Each concurrent claude_implement costs a git
      # clone plus a Claude CLI child process, so this is a memory/CPU knob, not a free
      # dial. Two ceilings to respect when raising it:
      #   * Claude tokens — concurrent runs SHARE the CLAUDE_WORKER_CLAUDE_CLI_TOKEN
      #     pool and the engine's sticky token index is best-effort, so N concurrent
      #     runs on one token hit the usage limit N times faster. Keep this <= the
      #     number of comma-separated tokens you supply.
      #   * MAX_WORKER_THREADS — sync handlers hold a thread for their whole run. The
      #     worker raises the pool to at least this value automatically.
      WORKER_MAX_CONCURRENT: "3"
      # Lease exactly what we can start right now — the loop already caps each lease
      # request at the free capacity, so this is just the per-call ceiling.
      LEASE_MAX_BATCH: "3"
      # Trace to a container-writable path (no host mount needed).
      CLAUDE_WORKER_TRACE: /tmp/claude-worker-trace.log
      # Dia chi registry de healthcheck tu kiem tra chinh minh.
      HC_URL: https://smdg-ai-tenant-1-ai-workflow-control-plane.cfapps.br10.hana.ondemand.com/api/v2/worker-replicas/classify_message
    # Tin hieu song: container NAY con heartbeat tuoi trong registry khong.
    # Khong dung do tuoi cua log — worker ranh thi im lang, se bao dong gia.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import json,os,socket,sys,urllib.request as u;h=socket.gethostname();d=json.load(u.urlopen(os.environ['HC_URL'],timeout=8));d=d.get('data',d) if isinstance(d,dict) else d;sys.exit(0 if [r for r in d if str(r.get('host'))==h and float(r.get('age_seconds') or 1e9)<180] else 1)\""]
      interval: 60s
      timeout: 15s
      # 3 lan lien tiep moi tinh la hong, de mot lan mang chop khong gay restart.
      retries: 3
      start_period: 90s
    restart: unless-stopped
    # Docker KHONG dung lai container `unhealthy` — `restart:` kich hoat khi tien
    # trinh THOAT, con `HEALTHCHECK` chi ghi mot nhan. Nhan nay la bo loc cho
    # `worker-autoheal.timer` (xem ../systemd/), thu lam phan dung lai.
    labels:
      autoheal: "true"
