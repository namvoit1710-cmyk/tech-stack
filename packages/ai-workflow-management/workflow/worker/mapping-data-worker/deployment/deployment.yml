name: worker-mapping-data-worker
buildContext: ..
buildContexts:
  worker-sdk: ../../worker-sdk
  # SA-1905 — source for the native streaming JSON->CSV wheel (built in a
  # Dockerfile stage; only the compiled wheel lands in the runtime image).
  json_csv_streamer: ../../../libs/json-csv-streamer

http2: false

memory:
  dev: 128M
  qas: 128M

instances:
  dev: 1
  qas: 1

env:
  WORKER_CHUNKED_OUTPUT_ENABLED:
    dev: "true"
    qas: "true"
  APP_NAME:
    dev: "Mapping Data Worker"
    qas: "Mapping Data Worker"
  WORKER_TYPE:
    dev: "mapping_data"
    qas: "mapping_data"
  WORKER_NODE_CLASS:
    dev: "TECHNICAL"
    qas: "TECHNICAL"
  WORKER_ICON:
    dev: "ArrowLeftRight"
    qas: "ArrowLeftRight"
  WORKER_COLOR:
    dev: "#F59E0B"
    qas: "#F59E0B"
  WORKER_TAGS:
    dev: "mapping,transform,data,technical"
    qas: "mapping,transform,data,technical"
  INFRA_MODE:
    dev: "sap"
    qas: "sap"
  MESSAGING_MODE:
    dev: "sap"
    qas: "sap"
  LOG_LEVEL:
    dev: DEBUG
    qas: INFO
  SERVER_HOST:
    dev: "0.0.0.0"
    qas: "0.0.0.0"
  SERVER_PORT:
    dev: 35000
    qas: 35000
  PROXY_URL:
    dev: https://smdg-ai-dev-worker-mapping-data-worker-dev.cfapps.br10.hana.ondemand.com
    qas: https://smdg-ai-dev-worker-mapping-data-worker-qas.cfapps.br10.hana.ondemand.com
  REGISTRY_URL:
    dev: https://smdg-ai-dev-ai-workflow-worker-executor.cfapps.br10.hana.ondemand.com
    qas: https://smdg-ai-dev-ai-workflow-worker-executor-qas.cfapps.br10.hana.ondemand.com
  FILE_SERVICE_URL:
    dev: https://smdg-ai-dev-file-service-dev.cfapps.br10.hana.ondemand.com
    qas: https://smdg-ai-dev-file-service-qas.cfapps.br10.hana.ondemand.com

services:
  dev:
    - simplemdg-logging
    - simplemdg-event-core-2
  qas:
    - wio-workflow-control-plane-db
    - simplemdg-logging
    - wio-orchestrator-management-001  # tenant-2 mirrors dev. CONFIG_TIER is literally 'tenant-2' there, and
  # deploy.yml resolves services with `.[$tier] // []` — without this key
  # the app is pushed with NO bindings (no HANA, no Event Mesh).
  tenant-2:
    - simplemdg-logging
    - simplemdg-event-core-2
