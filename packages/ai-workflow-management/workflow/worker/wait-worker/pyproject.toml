# Tooling config only. Minimal worker (layer1 value_objects + layer2 features);
# no layer3/4, so no import-linter layer contract here.
[tool.ruff]
target-version = "py312"
extend-exclude = ["build"]

[tool.ruff.lint]
# ANN = flake8-annotations (every function needs a return type, every arg a type).
# UP006/UP035 = prefer PEP 585 builtin generics (list[...] over typing.List).
select = ["ANN", "UP006", "UP035"]
# ANN401 permits explicit `Any` where a payload is genuinely dynamic (**kwargs).
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
