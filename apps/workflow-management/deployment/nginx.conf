# Bundles @ldc/autoform; rebuilt here so the form-builder default-value fix ships.
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/ttf
        font/otf;

    # Cheap liveness endpoint for the CF health check.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Hashed build assets — long cache. CORS so the host shell (served from a
    # different *.cfapps host) can pull this module-federation remote's chunks.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # MF entry + manifest: never cache, and must be CORS-readable — the shell's
    # MF runtime fetch()es mf-manifest.json cross-origin (fetch IS CORS-checked,
    # unlike <script> injection), so without ACAO the remote fails to load.
    location = /mf-manifest.json {
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "*" always;
    }
    location = /remoteEntry.js {
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "*" always;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}